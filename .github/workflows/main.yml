name: Build HeadFree

on:
  workflow_dispatch:
  push:
    paths:
      - 'HeadFree_FINAL_DESIGN_FIXED_v2.zip'
      - 'HeadFree_IconGenerator.swift'
      - 'HeadFree_VectorBranch.swift'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Prepare final project
        shell: bash
        run: |
          set -e
          rm -rf extracted build Payload
          unzip -q HeadFree_FINAL_DESIGN_FIXED_v2.zip -d extracted
          PROJECT=$(find extracted -type d -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          APP_DIR=$(find "$(dirname "$PROJECT")" -type f -name "ContentView.swift" -print -quit | xargs dirname)
          test -f "$APP_DIR/ContentView.swift"

          perl -0pi -e 's/                if let data = Data\(base64Encoded: hfReferenceBranchBase64\),.*?                }\n\n/                HFBotanicalBranch()\n                    .frame(width: min(235, geo.size.width * 0.48), height: min(430, geo.size.height * 0.52))\n                    .opacity(0.78)\n                    .frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .leading)\n                    .padding(.leading, -8)\n                    .padding(.top, 34)\n\n/s' "$APP_DIR/ContentView.swift"

          awk '/^struct HFEditingTask: Identifiable \{/{system("cat HeadFree_VectorBranch.swift")} {print}' "$APP_DIR/ContentView.swift" > "$APP_DIR/ContentView.swift.tmp"
          mv "$APP_DIR/ContentView.swift.tmp" "$APP_DIR/ContentView.swift"

          sed -i '' 's/INFOPLIST_KEY_UIRequiresFullScreen = NO;/INFOPLIST_KEY_UIRequiresFullScreen = YES;/g' "$PROJECT/project.pbxproj"
          sed -i '' 's/com.terezatakacova.HeadFree/com.terezatakacova.HeadFree5/g' "$PROJECT/project.pbxproj"

          swift HeadFree_IconGenerator.swift "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          grep -q 'HFBotanicalBranch' "$APP_DIR/ContentView.swift"
          grep -q 'com.terezatakacova.HeadFree5' "$PROJECT/project.pbxproj"
          grep -q 'INFOPLIST_KEY_UIRequiresFullScreen = YES;' "$PROJECT/project.pbxproj"
          test -f "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build iOS app
        shell: bash
        run: |
          set -e
          xcodebuild -project "$PROJECT" -scheme HeadFree -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Create IPA
        shell: bash
        run: |
          set -e
          test -d build/Build/Products/Release-iphoneos/HeadFree.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeadFree.app Payload/HeadFree.app
          /usr/bin/zip -qry "HeadFree-${GITHUB_RUN_NUMBER}.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-IPA-{{ github.run_number }}
          path: HeadFree-${GITHUB_RUN_NUMBER}.ipa
          if-no-files-found: error
