name: Build HeadFree

on:
  workflow_dispatch:
  push:
    paths:
      - 'HeadFree_FINAL_DESIGN_FIXED_v2.zip'
      - 'HeadFree_IconGenerator.swift'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Prepare and fix final project
        shell: bash
        run: |
          set -e
          rm -rf extracted build Payload
          unzip -q HeadFree_FINAL_DESIGN_FIXED_v2.zip -d extracted
          PROJECT=$(find extracted -type d -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          APP_DIR=$(find "$(dirname "$PROJECT")" -type f -name "ContentView.swift" -print -quit | xargs dirname)
          test -f "$APP_DIR/ContentView.swift"

          python3 - "$APP_DIR/ContentView.swift" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace("import UIKit\n", "")
          old = '''                if let data = Data(base64Encoded: hfReferenceBranchBase64),
                   let uiImage = UIImage(data: data) {
                    Image(uiImage: uiImage)
                        .resizable()
                        .scaledToFit()
                        .frame(width: min(235, geo.size.width * 0.48),
                               height: min(430, geo.size.height * 0.52))
                        .opacity(0.82)
                        .frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .leading)
                        .padding(.leading, -8)
                        .padding(.top, 34)
                }
'''
          new = '''                HFBotanicalBranch()
                    .frame(width: min(235, geo.size.width * 0.48),
                           height: min(430, geo.size.height * 0.52))
                    .opacity(0.78)
                    .frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .leading)
                    .padding(.leading, -8)
                    .padding(.top, 34)
'''
          if old not in s:
              raise SystemExit("Intro image block not found")
          s = s.replace(old, new)
          start = s.index("// MARK: - REFERENCE BOTANICAL BRANCH")
          end = s.index("struct HFEditingTask:", start)
          vector = '''// MARK: - VECTOR BOTANICAL BRANCH

private struct HFLeaf: View {
    let color: Color
    let rotation: Double
    let scale: CGFloat

    var body: some View {
        ZStack {
            Path { path in
                path.move(to: CGPoint(x: 35, y: 108))
                path.addQuadCurve(to: CGPoint(x: 34, y: 8), control: CGPoint(x: -4, y: 48))
                path.addQuadCurve(to: CGPoint(x: 35, y: 108), control: CGPoint(x: 76, y: 55))
            }
            .fill(color)
            Path { path in
                path.move(to: CGPoint(x: 35, y: 105))
                path.addLine(to: CGPoint(x: 35, y: 12))
            }
            .stroke(hfGold.opacity(0.72), lineWidth: 1.4)
        }
        .frame(width: 70, height: 110)
        .scaleEffect(scale)
        .rotationEffect(.degrees(rotation))
    }
}

struct HFBotanicalBranch: View {
    var body: some View {
        ZStack {
            Circle()
                .trim(from: 0.08, to: 0.82)
                .stroke(hfGold.opacity(0.75), lineWidth: 2)
                .rotationEffect(.degrees(18))
                .frame(width: 150, height: 150)
            Capsule()
                .fill(hfGold.opacity(0.9))
                .frame(width: 5, height: 220)
                .rotationEffect(.degrees(-36))
                .offset(x: -10, y: 24)
            HFLeaf(color: hfGreenLight.opacity(0.95), rotation: -58, scale: 0.92).offset(x: -46, y: 24)
            HFLeaf(color: hfGreen.opacity(0.82), rotation: -28, scale: 0.98).offset(x: -18, y: -10)
            HFLeaf(color: hfGreenLight.opacity(0.9), rotation: 12, scale: 0.9).offset(x: 18, y: 16)
            HFLeaf(color: hfGreen.opacity(0.9), rotation: 38, scale: 1.0).offset(x: 30, y: -46)
            HFLeaf(color: hfGreenLight.opacity(0.82), rotation: 64, scale: 0.82).offset(x: 2, y: -82)
        }
        .allowsHitTesting(false)
    }
}

'''
          s = s[:start] + vector + s[end:]
          p.write_text(s)
          PY

          sed -i '' 's/com.terezatakacova.HeadFree/com.terezatakacova.HeadFree3/g' "$PROJECT/project.pbxproj"
          swift HeadFree_IconGenerator.swift "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          grep -q 'HFBotanicalBranch' "$APP_DIR/ContentView.swift"
          grep -q 'com.terezatakacova.HeadFree3' "$PROJECT/project.pbxproj"
          test -f "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build iOS app
        shell: bash
        run: |
          set -e
          xcodebuild             -project "$PROJECT"             -scheme HeadFree             -sdk iphoneos             -configuration Release             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""

      - name: Create IPA
        shell: bash
        run: |
          set -e
          test -d build/Build/Products/Release-iphoneos/HeadFree.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeadFree.app Payload/HeadFree.app
          /usr/bin/zip -qry "HeadFree-${GITHUB_RUN_NUMBER}.ipa" Payload
          ls -lh "HeadFree-${GITHUB_RUN_NUMBER}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-IPA-${{ github.run_number }}
          path: HeadFree-${{ github.run_number }}.ipa
          if-no-files-found: error
