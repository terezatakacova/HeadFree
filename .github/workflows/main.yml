name: Build HeadFree

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Unzip and prepare project
        shell: bash
        run: |
          unzip -q HeadFree_FINAL_DESIGN_FIXED_v2.zip -d extracted

          PROJECT=$(find extracted -type d -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/project.pbxproj" ]; then
            echo "ERROR: Xcode project not found"
            exit 1
          fi

          APP_DIR=$(find "$(dirname "$PROJECT")" -type f -name "ContentView.swift" -print -quit | xargs dirname)
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "ERROR: App source folder not found"
            exit 1
          fi

          APP_FILE="$APP_DIR/HeadFreeApp.swift"
          if [ ! -f "$APP_FILE" ]; then
            SOURCE_APP=$(find "$APP_DIR" -type f -name "*App.swift" -print -quit)
            if [ -z "$SOURCE_APP" ]; then
              echo "ERROR: No App.swift file found"
              exit 1
            fi
            cp "$SOURCE_APP" "$APP_FILE"
          fi

          sed -i '' 's/struct HeadFeeApp: App/struct HeadFreeApp: App/' "$APP_FILE"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build iOS app
        shell: bash
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme HeadFree \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        shell: bash
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeadFree.app Payload/
          zip -r HeadFree.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-IPA
          path: HeadFree.ipa

          path: HeadFree.ipa
