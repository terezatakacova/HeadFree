name: Build HeadFree

on:
  workflow_dispatch:
  push:
    paths:
      - 'HeadFree_FINAL_DESIGN_FIXED_v2.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Verify and extract final project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="HeadFree_FINAL_DESIGN_FIXED_v2.zip"
          test -f "$ZIP"

          rm -rf extracted
          unzip -q "$ZIP" -d extracted

          PROJECT=$(find extracted -type d -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          test -f "$PROJECT/project.pbxproj"

          APP_DIR=$(find "$(dirname "$PROJECT")" -type f -name "ContentView.swift" -print -quit | xargs dirname)
          test -n "$APP_DIR"
          test -f "$APP_DIR/ContentView.swift"
          test -f "$APP_DIR/HeadFreeApp.swift"

          grep -q 'struct HeadFreeApp: App' "$APP_DIR/HeadFreeApp.swift"
          grep -q 'GENERATE_INFOPLIST_FILE = YES;' "$PROJECT/project.pbxproj"
          grep -q 'INFOPLIST_KEY_UILaunchScreen_Generation = YES;' "$PROJECT/project.pbxproj"
          grep -q 'INFOPLIST_KEY_UIRequiresFullScreen = NO;' "$PROJECT/project.pbxproj"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Final project verified: $PROJECT"

      - name: Build iOS app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build Payload HeadFree.ipa

          xcodebuild \
            -project "$PROJECT" \
            -scheme HeadFree \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify built app
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/HeadFree.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          echo "HeadFree.app successfully built."

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeadFree.app Payload/HeadFree.app
          /usr/bin/zip -qry HeadFree.ipa Payload
          test -s HeadFree.ipa
          ls -lh HeadFree.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-IPA
          path: HeadFree.ipa
          if-no-files-found: error
