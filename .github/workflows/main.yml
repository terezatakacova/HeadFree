name: Build HeadFree

on:
  workflow_dispatch:
  push:
    paths:
      - 'HeadFree_FINAL_DESIGN_FIXED_v2.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Verify final project ZIP
        shell: bash
        run: |
          test -f HeadFree_FINAL_DESIGN_FIXED_v2.zip
          echo "Using: HeadFree_FINAL_DESIGN_FIXED_v2.zip"
          ls -lh HeadFree_FINAL_DESIGN_FIXED_v2.zip

      - name: Unzip final project
        shell: bash
        run: |
          rm -rf extracted
          unzip -q HeadFree_FINAL_DESIGN_FIXED_v2.zip -d extracted

          PROJECT=$(find extracted -type d -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found in FINAL v2 ZIP"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT/project.pbxproj" ]; then
            echo "ERROR: project.pbxproj not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT"

      - name: Verify final source and modern screen settings
        shell: bash
        run: |
          APP_DIR=$(dirname "$(find "$(dirname "$PROJECT")" -type f -name "ContentView.swift" -print -quit)")
          test -f "$APP_DIR/ContentView.swift"
          test -f "$APP_DIR/HeadFreeApp.swift"

          grep -q 'headFreeIntroBase64' "$APP_DIR/ContentView.swift"
          grep -q 'INFOPLIST_KEY_UILaunchScreen_Generation = YES;' "$PROJECT/project.pbxproj"
          grep -q 'INFOPLIST_KEY_UIRequiresFullScreen = NO;' "$PROJECT/project.pbxproj"

          echo "Final source/settings verified."

      - name: Build iOS app with Xcode 26
        shell: bash
        run: |
          rm -rf build Payload HeadFree.ipa
          xcodebuild \
            -project "$PROJECT" \
            -scheme HeadFree \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            INFOPLIST_KEY_UILaunchScreen_Generation=YES

      - name: Create IPA
        shell: bash
        run: |
          test -d build/Build/Products/Release-iphoneos/HeadFree.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeadFree.app Payload/
          /usr/bin/zip -qry HeadFree.ipa Payload
          ls -lh HeadFree.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-IPA
          path: HeadFree.ipa
          if-no-files-found: error
