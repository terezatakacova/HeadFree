name: Build HeadFree

on:
  workflow_dispatch:
  push:
    paths:
      - 'HeadFree_FINAL_DESIGN_FIXED_v2.zip'
      - 'HeadFree_IconGenerator.swift'
      - 'HeadFree_VectorBranch.swift'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Prepare final project
        shell: bash
        run: |
          set -e
          rm -rf extracted build Payload
          unzip -q HeadFree_FINAL_DESIGN_FIXED_v2.zip -d extracted
          PROJECT=$(find extracted -type d -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          APP_DIR=$(find "$(dirname "$PROJECT")" -type f -name "ContentView.swift" -print -quit | xargs dirname)
          test -f "$APP_DIR/ContentView.swift"

          python3 - "$APP_DIR/ContentView.swift" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          src = path.read_text()
          start = src.find("struct HFIntroView: View {")
          if start < 0:
              raise SystemExit("HFIntroView not found")

          depth = 0
          end = None
          in_string = False
          escaped = False
          for i in range(start, len(src)):
              ch = src[i]
              if in_string:
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif ch == '"':
                      in_string = False
                  continue
              if ch == '"':
                  in_string = True
                  continue
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit("HFIntroView closing brace not found")

          replacement = r'''struct HFIntroView: View {
    let onContinue: () -> Void

    var body: some View {
        GeometryReader { geo in
            ZStack {
                hfBackground
                    .ignoresSafeArea()

                HFBotanicalBranch()
                    .scaleEffect(min(1.55, max(1.0, geo.size.width / 250)))
                    .offset(x: -geo.size.width * 0.20, y: -geo.size.height * 0.16)

                VStack(spacing: 0) {
                    Spacer(minLength: geo.size.height * 0.48)

                    Text("HeadFree")
                        .font(.system(size: min(42, geo.size.width * 0.105), weight: .regular, design: .serif))
                        .foregroundStyle(hfText)
                        .frame(maxWidth: .infinity)

                    Text("Všetko, čo ti beží v hlave, má teraz svoje miesto.")
                        .font(.system(size: min(18, geo.size.width * 0.045), weight: .regular, design: .rounded))
                        .foregroundStyle(hfText.opacity(0.82))
                        .multilineTextAlignment(.center)
                        .lineSpacing(4)
                        .padding(.horizontal, 34)
                        .padding(.top, 14)

                    Spacer(minLength: 28)

                    Button(action: onContinue) {
                        Text("Pokračovať")
                            .font(.system(size: 17, weight: .semibold, design: .rounded))
                            .foregroundStyle(hfBackground)
                            .padding(.horizontal, 30)
                            .padding(.vertical, 14)
                            .background(Capsule().fill(hfGreen))
                    }
                    .buttonStyle(.plain)

                    Spacer(minLength: geo.size.height * 0.10)
                }
                .frame(width: geo.size.width, height: geo.size.height)
            }
        }
    }
}'''

          path.write_text(src[:start] + replacement + src[end:])
          PY

          if ! grep -q 'struct HFBotanicalBranch' "$APP_DIR/ContentView.swift"; then
            awk '/^struct HFEditingTask: Identifiable \{/{system("cat HeadFree_VectorBranch.swift")} {print}' "$APP_DIR/ContentView.swift" > "$APP_DIR/ContentView.swift.tmp"
            mv "$APP_DIR/ContentView.swift.tmp" "$APP_DIR/ContentView.swift"
          fi

          sed -i '' 's/INFOPLIST_KEY_UIRequiresFullScreen = NO;/INFOPLIST_KEY_UIRequiresFullScreen = YES;/g' "$PROJECT/project.pbxproj"
          if ! grep -q 'INFOPLIST_KEY_UIRequiresFullScreen = YES;' "$PROJECT/project.pbxproj"; then
            sed -i '' '/IPHONEOS_DEPLOYMENT_TARGET = 17.5;/a\
              INFOPLIST_KEY_UIRequiresFullScreen = YES;
            ' "$PROJECT/project.pbxproj"
          fi

          sed -i '' 's/com.terezatakacova.HeadFree/com.terezatakacova.HeadFree5/g' "$PROJECT/project.pbxproj"
          swift HeadFree_IconGenerator.swift "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          grep -q 'struct HFIntroView: View' "$APP_DIR/ContentView.swift"
          grep -q 'HFBotanicalBranch' "$APP_DIR/ContentView.swift"
          grep -q 'INFOPLIST_KEY_UIRequiresFullScreen = YES;' "$PROJECT/project.pbxproj"
          grep -q 'com.terezatakacova.HeadFree5' "$PROJECT/project.pbxproj"
          test -f "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build iOS app
        shell: bash
        run: |
          set -e
          xcodebuild             -project "$PROJECT"             -scheme HeadFree             -sdk iphoneos             -configuration Release             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""

      - name: Create IPA
        shell: bash
        run: |
          set -e
          test -d build/Build/Products/Release-iphoneos/HeadFree.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeadFree.app Payload/HeadFree.app
          /usr/bin/zip -qry "HeadFree-${GITHUB_RUN_NUMBER}.ipa" Payload
          ls -lh "HeadFree-${GITHUB_RUN_NUMBER}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-IPA-{{ github.run_number }}
          path: HeadFree-${GITHUB_RUN_NUMBER}.ipa
          if-no-files-found: error
