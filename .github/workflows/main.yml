name: Build HeadFree

on:
  workflow_dispatch:
  push:
    paths:
      - 'HeadFree_FINAL_DESIGN_FIXED_v2.zip'
      - 'HeadFree_IconGenerator.swift'
      - 'HeadFree_VectorBranch.swift'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Prepare final project
        shell: bash
        run: |
          set -e
          rm -rf extracted build Payload
          unzip -q HeadFree_FINAL_DESIGN_FIXED_v2.zip -d extracted
          PROJECT=$(find extracted -type d -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          APP_DIR=$(find "$(dirname "$PROJECT")" -type f -name "ContentView.swift" -print -quit | xargs dirname)
          test -f "$APP_DIR/ContentView.swift"

          perl -0pi -e 's/                if let data = Data\(base64Encoded: hfReferenceBranchBase64\),.*?                }\n\n/                HFBotanicalBranch()\n                    .frame(width: min(235, geo.size.width * 0.48), height: min(430, geo.size.height * 0.52))\n                    .opacity(0.78)\n                    .frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .leading)\n                    .padding(.leading, -8)\n                    .padding(.top, 34)\n\n/s' "$APP_DIR/ContentView.swift"

          python3 - "$APP_DIR/ContentView.swift" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          intro_start = s.index("struct HFIntroView: View {")
          intro_end = s.index("struct HeadFreeHomeView: View {")

          intro = r'''struct HFIntroView: View {
              let onContinue: () -> Void

              private let cream = Color(red: 0.955, green: 0.935, blue: 0.885)
              private let olive = Color(red: 0.430, green: 0.510, blue: 0.355)
              private let text = Color(red: 0.245, green: 0.255, blue: 0.225)
              private let subtitle = Color(red: 0.470, green: 0.465, blue: 0.405)

              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          cream.ignoresSafeArea()

                          if let data = Data(base64Encoded: hfReferenceBranchBase64),
                             let uiImage = UIImage(data: data) {
                              Image(uiImage: uiImage)
                                  .resizable()
                                  .interpolation(.high)
                                  .scaledToFit()
                                  .scaleEffect(x: -1, y: 1)
                                  .frame(
                                      width: min(235, geo.size.width * 0.60),
                                      height: min(430, geo.size.height * 0.52)
                                  )
                                  .opacity(0.82)
                                  .frame(
                                      maxWidth: .infinity,
                                      maxHeight: .infinity,
                                      alignment: .topLeading
                                  )
                                  .padding(.leading, -8)
                                  .padding(.top, 34)
                          }

                          VStack(alignment: .leading, spacing: 0) {
                              Text("HeadFree")
                                  .font(
                                      .system(
                                          size: 42,
                                          weight: .regular,
                                          design: .serif
                                      )
                                  )
                                  .foregroundStyle(text)
                                  .padding(.bottom, 14)

                              Text("Calm your mind.\\nFree your head.")
                                  .font(
                                      .system(
                                          size: 17,
                                          weight: .regular,
                                          design: .serif
                                      )
                                  )
                                  .tracking(0.4)
                                  .lineSpacing(7)
                                  .foregroundStyle(subtitle)
                          }
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .padding(.leading, 68)
                          .padding(.top, geo.size.height * 0.48)

                          VStack {
                              Spacer()

                              Button(action: onContinue) {
                                  HStack {
                                      Text("Pokračovať")
                                          .font(.system(size: 16, weight: .medium))

                                      Spacer()

                                      Image(systemName: "arrow.right")
                                          .font(.system(size: 16, weight: .regular))
                                  }
                                  .foregroundStyle(.white)
                                  .padding(.horizontal, 20)
                                  .frame(
                                      width: min(250, geo.size.width * 0.68),
                                      height: 54
                                  )
                                  .background(olive, in: Capsule())
                              }
                              .buttonStyle(.plain)
                              .padding(
                                  .bottom,
                                  max(28, geo.safeAreaInsets.bottom + 20)
                              )
                          }
                      }
                  }
                  .ignoresSafeArea()
              }
          }

          '''

          s = s[:intro_start] + intro + s[intro_end:]
          p.write_text(s)
          PY

          sed -i '' 's/INFOPLIST_KEY_UIRequiresFullScreen = NO;/INFOPLIST_KEY_UIRequiresFullScreen = YES;/g' "$PROJECT/project.pbxproj"
          sed -i '' 's/com.terezatakacova.HeadFree/com.terezatakacova.HeadFree5/g' "$PROJECT/project.pbxproj"

          swift HeadFree_IconGenerator.swift "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          grep -q 'HFBotanicalBranch' "$APP_DIR/ContentView.swift"
          grep -q 'Calm your mind.' "$APP_DIR/ContentView.swift"
          grep -q 'com.terezatakacova.HeadFree5' "$PROJECT/project.pbxproj"
          grep -q 'INFOPLIST_KEY_UIRequiresFullScreen = YES;' "$PROJECT/project.pbxproj"
          test -f "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build iOS app
        shell: bash
        run: |
          set -e
          xcodebuild -project "$PROJECT" -scheme HeadFree -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Create IPA
        shell: bash
        run: |
          set -e
          test -d build/Build/Products/Release-iphoneos/HeadFree.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeadFree.app Payload/HeadFree.app
          /usr/bin/zip -qry "HeadFree-${GITHUB_RUN_NUMBER}.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-IPA-${{ github.run_number }}
          path: HeadFree-${{ github.run_number }}.ipa
          if-no-files-found: error
