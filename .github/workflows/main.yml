name: Build HeadFree
# Final combined build: persistence, expense editing/deletion, visual polish and icon.

on:
  workflow_dispatch:
  push:
    paths:
      - 'HeadFree_FINAL_DESIGN_FIXED_v2.zip'
      - 'HeadFree_IconGenerator.swift'
      - 'HeadFree_VectorBranch.swift'
      - 'HeadFreeIntroReference.jpg'
      - 'HeadFree_AppIcon_FINAL.jpg'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Prepare final project
        shell: bash
        run: |
          set -e
          rm -rf extracted build Payload
          unzip -q HeadFree_FINAL_DESIGN_FIXED_v2.zip -d extracted
          PROJECT=$(find extracted -type d -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          APP_DIR=$(find "$(dirname "$PROJECT")" -type f -name "ContentView.swift" -print -quit | xargs dirname)
          test -f "$APP_DIR/ContentView.swift"

          mkdir -p "$APP_DIR/Assets.xcassets/HeadFreeIntroIcon.imageset"
          cat > "$APP_DIR/Assets.xcassets/HeadFreeIntroIcon.imageset/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "HeadFreeIntroIcon.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          python3 - "$APP_DIR/ContentView.swift" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()
          intro_start = s.index("struct HFIntroView: View {")
          intro_end = s.index("struct HeadFreeHomeView: View {")

          intro = r'''struct HFIntroView: View {
              let onContinue: () -> Void

              private let paper = Color(red: 0.95, green: 0.93, blue: 0.87)
              private let ink = Color(red: 0.25, green: 0.24, blue: 0.21)
              private let olive = Color(red: 0.43, green: 0.51, blue: 0.36)

              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          paper.ignoresSafeArea()

                          VStack(spacing: 0) {
                              Spacer()

                              Image("HeadFreeIntroIcon")
                                  .resizable()
                                  .scaledToFit()
                                  .frame(width: min(150, geo.size.width * 0.38),
                                         height: min(150, geo.size.width * 0.38))

                              Text("HeadFree")
                                  .font(.system(size: 44, weight: .regular, design: .serif))
                                  .foregroundStyle(ink)
                                  .padding(.top, 22)

                              Text("Calm your mind.\nFree your head.")
                                  .font(.system(size: 18, weight: .regular, design: .serif))
                                  .lineSpacing(6)
                                  .multilineTextAlignment(.center)
                                  .foregroundStyle(ink.opacity(0.82))
                                  .padding(.top, 12)

                              Spacer()

                              Button(action: onContinue) {
                                  HStack(spacing: 12) {
                                      Text("Pokračovať")
                                          .font(.system(size: 17, weight: .medium))
                                      Image(systemName: "arrow.right")
                                          .font(.system(size: 18, weight: .regular))
                                  }
                                  .foregroundStyle(.white)
                                  .frame(width: min(300, geo.size.width * 0.78), height: 56)
                                  .background(olive, in: Capsule())
                              }
                              .buttonStyle(.plain)
                              .padding(.bottom, max(24, geo.safeAreaInsets.bottom + 12))
                          }
                          .padding(.horizontal, 24)
                      }
                  }
                  .ignoresSafeArea()
              }
          }
          '''

          s = s[:intro_start] + intro + s[intro_end:]
          p.write_text(s)
          PY

          sed -i '' 's/INFOPLIST_KEY_UIRequiresFullScreen = NO;/INFOPLIST_KEY_UIRequiresFullScreen = YES;/g' "$PROJECT/project.pbxproj"
          sed -i '' 's/com.terezatakacova.HeadFree/com.terezatakacova.HeadFree5/g' "$PROJECT/project.pbxproj"

          python3 - "$APP_DIR/ContentView.swift" <<'PYEXP'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          a=s.index("struct ExpensesView: View {"); b=s.index("// MARK: - SIMPLE ADD",a)
          new=r'''struct ExpensesView: View {
              @State private var expenses: [String] = storedArray("plannedExpenses")
              @State private var editingExpense: String?
              @State private var showAdd = false
              var body: some View {
                  HFPageBackground {
                      ScrollView(showsIndicators: false) {
                          LazyVStack(spacing: 0) {
                              ForEach(expenses, id: \.self) { expense in
                                  Button { editingExpense = expense } label: {
                                      HStack(spacing: 13) {
                                          Image(systemName: "eurosign.circle").foregroundStyle(hfGold)
                                          Text(expense).font(.system(size: 16)).foregroundStyle(hfText)
                                          Spacer()
                                          Image(systemName: "chevron.right").font(.system(size: 13)).foregroundStyle(hfMuted)
                                      }.padding(20).contentShape(Rectangle())
                                  }.buttonStyle(.plain)
                                  .overlay(alignment: .bottom) { Rectangle().fill(hfLine).frame(height: 1) }
                              }
                          }
                      }
                  }
                  .navigationTitle("Plánované výdavky")
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbarBackground(hfBackground, for: .navigationBar)
                  .toolbar {
                      ToolbarItem(placement: .topBarTrailing) {
                          Button { showAdd = true } label: {
                              Image(systemName: "plus").foregroundStyle(hfText).frame(width: 40, height: 40).background(hfGold.opacity(0.16), in: Circle())
                          }
                      }
                  }
                  .sheet(isPresented: Binding(get: { editingExpense != nil }, set: { if !$0 { editingExpense = nil } })) {
                      HFExpenseEditView(expense: editingExpense ?? "", onSave: { value in
                          if let i = expenses.firstIndex(of: editingExpense ?? "") { expenses[i] = value; UserDefaults.standard.set(expenses, forKey: "plannedExpenses") }
                      }, onDelete: {
                          expenses.removeAll { $0 == (editingExpense ?? "") }; UserDefaults.standard.set(expenses, forKey: "plannedExpenses")
                      })
                  }
                  .sheet(isPresented: $showAdd) {
                      HFTextAddView(title: "Nový výdavok", placeholder: "Čo plánuješ kúpiť alebo zaplatiť?") { value in
                          let text=value.trimmingCharacters(in: .whitespacesAndNewlines); guard !text.isEmpty else { return }
                          expenses.append(text); UserDefaults.standard.set(expenses, forKey: "plannedExpenses")
                      }
                  }
              }
          }

          struct HFExpenseEditView: View {
              @Environment(\.dismiss) private var dismiss
              let expense: String; let onSave: (String)->Void; let onDelete: ()->Void
              @State private var text: String
              init(expense: String, onSave: @escaping (String)->Void, onDelete: @escaping ()->Void) {
                  self.expense=expense; self.onSave=onSave; self.onDelete=onDelete; _text=State(initialValue: expense)
              }
              var body: some View {
                  NavigationStack {
                      Form {
                          Section("Výdavok") { TextField("Čo plánuješ kúpiť alebo zaplatiť?", text: $text) }
                          Section { Button(role: .destructive) { onDelete(); dismiss() } label: { Label("Vymazať výdavok", systemImage: "trash") } }
                      }
                      .navigationTitle("Upraviť výdavok").navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) { Button("Zrušiť") { dismiss() } }
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Uložiť") {
                                  let value=text.trimmingCharacters(in: .whitespacesAndNewlines); guard !value.isEmpty else { return }
                                  onSave(value); dismiss()
                              }
                          }
                      }
                  }
              }
          }

          // MARK: - SIMPLE ADD
          '''
          p.write_text(s[:a]+new+s[b+len("// MARK: - SIMPLE ADD"):])
          PYEXP

          python3 -c 'import sys,base64; exec(base64.b64decode(""))' "$APP_DIR/ContentView.swift"

          curl -fsSL "https://raw.githubusercontent.com/terezatakacova/HeadFree/main/HeadFree_AppIcon_FINAL.jpg" -o /tmp/HeadFree_AppIcon_FINAL.jpg
          sips -s format png -z 1024 1024 /tmp/HeadFree_AppIcon_FINAL.jpg --out "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png" >/dev/null
          cp "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png" "$APP_DIR/Assets.xcassets/HeadFreeIntroIcon.imageset/HeadFreeIntroIcon.png"

          grep -q 'Image("HeadFreeIntroIcon")' "$APP_DIR/ContentView.swift"
          grep -q 'Calm your mind.' "$APP_DIR/ContentView.swift"
          grep -q 'com.terezatakacova.HeadFree5' "$PROJECT/project.pbxproj"
          grep -q 'INFOPLIST_KEY_UIRequiresFullScreen = YES;' "$PROJECT/project.pbxproj"
          test -f "$APP_DIR/Assets.xcassets/HeadFreeIntroIcon.imageset/HeadFreeIntroIcon.png"
          test -f "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Export source for inspection
        shell: bash
        run: |
          set -e
          SOURCE=$(find extracted -type f -name "ContentView.swift" -print -quit)
          test -n "$SOURCE"
          cp "$SOURCE" ContentView.swift

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-Source-${{ github.run_number }}
          path: ContentView.swift
          if-no-files-found: error

      - name: Build iOS app
        shell: bash
        run: |
          set -e
          xcodebuild -project "$PROJECT" -scheme HeadFree -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Create IPA
        shell: bash
        run: |
          set -e
          test -d build/Build/Products/Release-iphoneos/HeadFree.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeadFree.app Payload/HeadFree.app
          /usr/bin/zip -qry "HeadFree-${{ github.run_number }}.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-IPA-${{ github.run_number }}
          path: HeadFree-${{ github.run_number }}.ipa
          if-no-files-found: error
