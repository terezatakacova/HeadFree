name: Build HeadFree
# Final combined build: persistence, expense editing/deletion, visual polish and icon.

on:
  workflow_dispatch:
  push:
    paths:
      - 'HeadFree_FINAL_DESIGN_FIXED_v2.zip'
      - 'HeadFree_IconGenerator.swift'
      - 'HeadFree_VectorBranch.swift'
      - 'HeadFreeIntroReference.jpg'
      - 'HeadFree_AppIcon_FINAL.jpg'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Prepare final project
        shell: bash
        run: |
          set -e
          rm -rf extracted build Payload
          unzip -q HeadFree_FINAL_DESIGN_FIXED_v2.zip -d extracted
          PROJECT=$(find extracted -type d -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          APP_DIR=$(find "$(dirname "$PROJECT")" -type f -name "ContentView.swift" -print -quit | xargs dirname)
          test -f "$APP_DIR/ContentView.swift"

          mkdir -p "$APP_DIR/Assets.xcassets/HeadFreeIntroIcon.imageset"
          cat > "$APP_DIR/Assets.xcassets/HeadFreeIntroIcon.imageset/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "HeadFreeIntroIcon.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          python3 - "$APP_DIR/ContentView.swift" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()
          intro_start = s.index("struct HFIntroView: View {")
          intro_end = s.index("struct HeadFreeHomeView: View {")

          intro = r'''struct HFIntroView: View {
              let onContinue: () -> Void

              private let paper = Color(red: 0.95, green: 0.93, blue: 0.87)
              private let ink = Color(red: 0.25, green: 0.24, blue: 0.21)
              private let olive = Color(red: 0.43, green: 0.51, blue: 0.36)

              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          paper.ignoresSafeArea()

                          VStack(spacing: 0) {
                              Spacer()

                              Image("HeadFreeIntroIcon")
                                  .resizable()
                                  .scaledToFit()
                                  .frame(width: min(150, geo.size.width * 0.38),
                                         height: min(150, geo.size.width * 0.38))

                              Text("HeadFree")
                                  .font(.system(size: 44, weight: .regular, design: .serif))
                                  .foregroundStyle(ink)
                                  .padding(.top, 22)

                              Text("Calm your mind.\nFree your head.")
                                  .font(.system(size: 18, weight: .regular, design: .serif))
                                  .lineSpacing(6)
                                  .multilineTextAlignment(.center)
                                  .foregroundStyle(ink.opacity(0.82))
                                  .padding(.top, 12)

                              Spacer()

                              Button(action: onContinue) {
                                  HStack(spacing: 12) {
                                      Text("Pokračovať")
                                          .font(.system(size: 17, weight: .medium))
                                      Image(systemName: "arrow.right")
                                          .font(.system(size: 18, weight: .regular))
                                  }
                                  .foregroundStyle(.white)
                                  .frame(width: min(300, geo.size.width * 0.78), height: 56)
                                  .background(olive, in: Capsule())
                              }
                              .buttonStyle(.plain)
                              .padding(.bottom, max(24, geo.safeAreaInsets.bottom + 12))
                          }
                          .padding(.horizontal, 24)
                      }
                  }
                  .ignoresSafeArea()
              }
          }
          '''

          s = s[:intro_start] + intro + s[intro_end:]
          p.write_text(s)
          PY

          sed -i '' 's/INFOPLIST_KEY_UIRequiresFullScreen = NO;/INFOPLIST_KEY_UIRequiresFullScreen = YES;/g' "$PROJECT/project.pbxproj"
          sed -i '' 's/com.terezatakacova.HeadFree/com.terezatakacova.HeadFree5/g' "$PROJECT/project.pbxproj"

          python3 - "$APP_DIR/ContentView.swift" <<'PYEXP'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          a=s.index("struct ExpensesView: View {"); b=s.index("// MARK: - SIMPLE ADD",a)
          new=r'''struct ExpensesView: View {
              @State private var expenses: [String] = storedArray("plannedExpenses")
              @State private var editingExpense: String?
              @State private var showAdd = false
              var body: some View {
                  HFPageBackground {
                      ScrollView(showsIndicators: false) {
                          LazyVStack(spacing: 0) {
                              ForEach(expenses, id: \.self) { expense in
                                  Button { editingExpense = expense } label: {
                                      HStack(spacing: 13) {
                                          Image(systemName: "eurosign.circle").foregroundStyle(hfGold)
                                          Text(expense).font(.system(size: 16)).foregroundStyle(hfText)
                                          Spacer()
                                          Image(systemName: "chevron.right").font(.system(size: 13)).foregroundStyle(hfMuted)
                                      }.padding(20).contentShape(Rectangle())
                                  }.buttonStyle(.plain)
                                  .overlay(alignment: .bottom) { Rectangle().fill(hfLine).frame(height: 1) }
                              }
                          }
                      }
                  }
                  .navigationTitle("Plánované výdavky")
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbarBackground(hfBackground, for: .navigationBar)
                  .toolbar {
                      ToolbarItem(placement: .topBarTrailing) {
                          Button { showAdd = true } label: {
                              Image(systemName: "plus").foregroundStyle(hfText).frame(width: 40, height: 40).background(hfGold.opacity(0.16), in: Circle())
                          }
                      }
                  }
                  .sheet(isPresented: Binding(get: { editingExpense != nil }, set: { if !$0 { editingExpense = nil } })) {
                      HFExpenseEditView(expense: editingExpense ?? "", onSave: { value in
                          if let i = expenses.firstIndex(of: editingExpense ?? "") { expenses[i] = value; UserDefaults.standard.set(expenses, forKey: "plannedExpenses") }
                      }, onDelete: {
                          expenses.removeAll { $0 == (editingExpense ?? "") }; UserDefaults.standard.set(expenses, forKey: "plannedExpenses")
                      })
                  }
                  .sheet(isPresented: $showAdd) {
                      HFTextAddView(title: "Nový výdavok", placeholder: "Čo plánuješ kúpiť alebo zaplatiť?") { value in
                          let text=value.trimmingCharacters(in: .whitespacesAndNewlines); guard !text.isEmpty else { return }
                          expenses.append(text); UserDefaults.standard.set(expenses, forKey: "plannedExpenses")
                      }
                  }
              }
          }

          struct HFExpenseEditView: View {
              @Environment(\.dismiss) private var dismiss
              let expense: String; let onSave: (String)->Void; let onDelete: ()->Void
              @State private var text: String
              init(expense: String, onSave: @escaping (String)->Void, onDelete: @escaping ()->Void) {
                  self.expense=expense; self.onSave=onSave; self.onDelete=onDelete; _text=State(initialValue: expense)
              }
              var body: some View {
                  NavigationStack {
                      Form {
                          Section("Výdavok") { TextField("Čo plánuješ kúpiť alebo zaplatiť?", text: $text) }
                          Section { Button(role: .destructive) { onDelete(); dismiss() } label: { Label("Vymazať výdavok", systemImage: "trash") } }
                      }
                      .navigationTitle("Upraviť výdavok").navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) { Button("Zrušiť") { dismiss() } }
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Uložiť") {
                                  let value=text.trimmingCharacters(in: .whitespacesAndNewlines); guard !value.isEmpty else { return }
                                  onSave(value); dismiss()
                              }
                          }
                      }
                  }
              }
          }

          // MARK: - SIMPLE ADD
          '''
          p.write_text(s[:a]+new+s[b+len("// MARK: - SIMPLE ADD"):])
          PYEXP

          python3 -c 'import sys,base64; exec(base64.b64decode(""))' "$APP_DIR/ContentView.swift"

          # Fix Swift Unicode escape sequences emitted by the shopping editor generator.
          python3 - "$APP_DIR/ContentView.swift" <<'PYPATCH'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace(r'\\u{', r'\u{')
          # Support both legacy delimited strings and native [String] UserDefaults values.
          a = s.index("private func storedArray(")
          b = s.index("// MARK: - TASK LISTS", a)
          helper = '''private func storedArray(_ key: String) -> [String] {
              if let values = UserDefaults.standard.array(forKey: key) as? [String] {
                  return values
              }
              guard let value = UserDefaults.standard.string(forKey: key), !value.isEmpty else {
                  return []
              }
              return value.components(separatedBy: "|||")
          }

          '''
          s = s[:a] + helper + s[b:]
          save_helper = '''private func saveArray(_ values: [String], forKey key: String) {
              UserDefaults.standard.removeObject(forKey: key)
              UserDefaults.standard.set(values, forKey: key)
          }

          '''
          insert_at = s.index("// MARK: - TASK LISTS")
          s = s[:insert_at] + save_helper + s[insert_at:]
          # Route every known editable list write through the same persistence helper.
          s = s.replace('UserDefaults.standard.set(tasks, forKey: scope.tasksKey)', 'saveArray(tasks, forKey: scope.tasksKey)')
          s = s.replace('UserDefaults.standard.set(Array(completed), forKey: scope.completedKey)', 'saveArray(Array(completed), forKey: scope.completedKey)')
          for variable, key in [('ideas','ideas'),('items','shoppingItems'),('Array(completed)','completedShoppingItems'),('expenses','plannedExpenses'),('manual','manualReminders')]:
              s = s.replace(f'UserDefaults.standard.set({variable}, forKey: "{key}")', f'saveArray({variable}, forKey: "{key}")')
          p.write_text(s)
          PYPATCH

          # Apply the remaining agreed UI and CRUD fixes to Ideas, planned expenses and reminders.
          python3 - "$APP_DIR/ContentView.swift" <<'PYREMAIN'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()

          # Let users delete tasks from the task editor, including the weekly list.
          s = s.replace(
              '    let onSave: (String, Date?) -> Void\\n\\n    init(originalTask: String, reminder: Date?, onSave: @escaping (String, Date?) -> Void) {',
              '    let onSave: (String, Date?) -> Void\\n    let onDelete: () -> Void\\n\\n    init(originalTask: String, reminder: Date?, onSave: @escaping (String, Date?) -> Void, onDelete: @escaping () -> Void) {'
          )
          s = s.replace(
              '        self.onSave = onSave\\n        _text = State(initialValue: originalTask)',
              '        self.onSave = onSave\\n        self.onDelete = onDelete\\n        _text = State(initialValue: originalTask)'
          )
          s = s.replace(
              '                newReminder: newReminder\\n                )\\n            }\\n        }\\n    }\\n\\n    private func persist()',
              '                newReminder: newReminder\\n                )\\n            }, onDelete: {\\n                delete(selectedTask.text)\\n            })\\n        }\\n    }\\n\\n    private func persist()'
          )
          s = s.replace(
              '                        HFPlainInput(title: "Úloha", text: $text, placeholder: "Čo treba urobiť?")',
              '                        HFPlainInput(title: "Úloha", text: $text, placeholder: "Čo treba urobiť?")\\n                        Button(role: .destructive) { onDelete(); dismiss() } label: {\\n                            Label("Vymazať úlohu", systemImage: "trash").frame(maxWidth: .infinity).frame(height: 48)\\n                        }.padding(.horizontal, 20).padding(.top, 14)'
          )

          a = s.index("struct IdeasView: View {")
          b = s.index("// MARK: - SHOPPING", a)
          ideas = r'''struct IdeasView: View {
              @State private var ideas: [String] = storedArray("ideas")
              @State private var editingIdea: String?
              @State private var showAdd = false
              var body: some View {
                  HFPageBackground {
                      ScrollView(showsIndicators: false) {
                          LazyVStack(spacing: 0) {
                              ForEach(ideas, id: \.self) { idea in
                                  Button { editingIdea = idea } label: {
                                      HStack(spacing: 13) {
                                          Image(systemName: "lightbulb").foregroundStyle(hfGold)
                                          Text(idea).font(.system(size: 16)).foregroundStyle(hfText)
                                          Spacer()
                                          Image(systemName: "chevron.right").font(.system(size: 13)).foregroundStyle(hfMuted)
                                      }.padding(20).contentShape(Rectangle())
                                  }.buttonStyle(.plain)
                                  .overlay(alignment: .bottom) { Rectangle().fill(hfLine).frame(height: 1) }
                              }
                          }
                      }
                  }
                  .navigationTitle("Nápady").navigationBarTitleDisplayMode(.inline)
                  .toolbarBackground(hfBackground, for: .navigationBar)
                  .toolbar { ToolbarItem(placement: .topBarTrailing) {
                      Button { showAdd = true } label: {
                          Image(systemName: "plus").foregroundStyle(hfText).frame(width: 40, height: 40).background(hfGold.opacity(0.16), in: Circle())
                      }
                  }}
                  .sheet(isPresented: Binding(get: { editingIdea != nil }, set: { if !$0 { editingIdea = nil } })) {
                      HFTextEditView(title: "Upraviť nápad", placeholder: "Napíš nápad…", value: editingIdea ?? "", onSave: { value in
                          if let i = ideas.firstIndex(of: editingIdea ?? "") { ideas[i] = value; UserDefaults.standard.set(ideas, forKey: "ideas") }
                      }, onDelete: {
                          ideas.removeAll { $0 == (editingIdea ?? "") }; UserDefaults.standard.set(ideas, forKey: "ideas")
                      })
                  }
                  .sheet(isPresented: $showAdd) {
                      HFTextAddView(title: "Nový nápad", placeholder: "Napíš nápad…") { value in
                          let text = value.trimmingCharacters(in: .whitespacesAndNewlines)
                          guard !text.isEmpty else { return }
                          ideas.append(text); UserDefaults.standard.set(ideas, forKey: "ideas")
                      }
                  }
              }
          }

          '''
          s = s[:a] + ideas + s[b:]

          # Replace the expense editor by source boundaries, not brittle whitespace matching.
          start = s.index("struct HFExpenseEditView: View {")
          end = s.index("// MARK: - SIMPLE ADD", start)
          expense_editor = r'''struct HFExpenseEditView: View {
              @Environment(\.dismiss) private var dismiss
              let expense: String
              let onSave: (String) -> Void
              let onDelete: () -> Void
              @State private var text: String
              init(expense: String, onSave: @escaping (String) -> Void, onDelete: @escaping () -> Void) {
                  self.expense = expense; self.onSave = onSave; self.onDelete = onDelete
                  _text = State(initialValue: expense)
              }
              var body: some View {
                  NavigationStack {
                      HFPageBackground {
                          VStack(alignment: .leading, spacing: 18) {
                              Text("VÝDAVOK").font(.system(size: 12, weight: .semibold)).tracking(1.2).foregroundStyle(hfMuted)
                              TextField("Čo plánuješ kúpiť alebo zaplatiť?", text: $text, axis: .vertical)
                                  .font(.system(size: 17)).foregroundStyle(hfText).lineLimit(2...5)
                                  .padding(16).background(hfText.opacity(0.055), in: RoundedRectangle(cornerRadius: 16))
                                  .overlay { RoundedRectangle(cornerRadius: 16).stroke(hfLine, lineWidth: 1) }
                              Button(role: .destructive) { onDelete(); dismiss() } label: {
                                  Label("Vymazať výdavok", systemImage: "trash").frame(maxWidth: .infinity).frame(height: 52)
                                      .background(.red.opacity(0.07), in: RoundedRectangle(cornerRadius: 16))
                              }.tint(.red.opacity(0.85))
                              Spacer()
                          }.padding(20)
                      }
                      .navigationTitle("Upraviť výdavok").navigationBarTitleDisplayMode(.inline)
                      .toolbarBackground(hfBackground, for: .navigationBar)
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) { Button("Zrušiť") { dismiss() }.foregroundStyle(hfText) }
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Uložiť") {
                                  let value = text.trimmingCharacters(in: .whitespacesAndNewlines)
                                  guard !value.isEmpty else { return }
                                  onSave(value); dismiss()
                              }.foregroundStyle(hfGreen).fontWeight(.semibold)
                          }
                      }
                  }
              }
          }

          '''
          s = s[:start] + expense_editor + s[end:]

          # Shared styled text editor for editing ideas without relying on system Form.
          marker = "// MARK: - SIMPLE ADD"
          edit_view = r'''struct HFTextEditView: View {
              @Environment(\.dismiss) private var dismiss
              let title: String
              let placeholder: String
              let value: String
              let onSave: (String) -> Void
              let onDelete: () -> Void
              @State private var text: String
              init(title: String, placeholder: String, value: String, onSave: @escaping (String) -> Void, onDelete: @escaping () -> Void) {
                  self.title = title; self.placeholder = placeholder; self.value = value
                  self.onSave = onSave; self.onDelete = onDelete
                  _text = State(initialValue: value)
              }
              var body: some View {
                  NavigationStack {
                      HFPageBackground {
                          VStack(alignment: .leading, spacing: 18) {
                              Text(title.uppercased()).font(.system(size: 12, weight: .semibold)).tracking(1.2).foregroundStyle(hfMuted)
                              TextEditor(text: $text).font(.system(size: 17)).foregroundStyle(hfText)
                                  .scrollContentBackground(.hidden).padding(12).frame(minHeight: 130)
                                  .background(hfText.opacity(0.055), in: RoundedRectangle(cornerRadius: 16))
                                  .overlay { RoundedRectangle(cornerRadius: 16).stroke(hfLine, lineWidth: 1) }
                              Button(role: .destructive) { onDelete(); dismiss() } label: {
                                  Label("Vymazať", systemImage: "trash").frame(maxWidth: .infinity).frame(height: 52)
                                      .background(.red.opacity(0.07), in: RoundedRectangle(cornerRadius: 16))
                              }.tint(.red.opacity(0.85))
                              Spacer()
                          }.padding(20)
                      }
                      .navigationTitle(title).navigationBarTitleDisplayMode(.inline)
                      .toolbarBackground(hfBackground, for: .navigationBar)
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) { Button("Zrušiť") { dismiss() }.foregroundStyle(hfText) }
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Uložiť") {
                                  let v = text.trimmingCharacters(in: .whitespacesAndNewlines)
                                  guard !v.isEmpty else { return }
                                  onSave(v); dismiss()
                              }.foregroundStyle(hfGreen).fontWeight(.semibold)
                          }
                      }
                  }
              }
          }

          '''
          if marker not in s: raise SystemExit("Simple Add marker not found")
          s = s.replace(marker, edit_view + marker, 1)

          # Reminders are derived from tasks elsewhere; provide a working add/manage screen
          # backed by a dedicated persisted list, while retaining task-derived reminders.
          a = s.index("struct HFRemindersView: View {")
          b = s.index("// MARK: - SETTINGS", a)
          reminders = r'''struct HFRemindersView: View {
              @State private var manual: [String] = storedArray("manualReminders")
              @State private var editing: String?
              @State private var showAdd = false
              private var taskReminders: [(String, Date)] {
                  var result: [(String, Date)] = []
                  for scope in [HFTaskScope.today, .week, .month] {
                      let tasks = storedArray(scope.tasksKey)
                      let current = loadReminderData(scope.reminderKey)
                      for task in tasks { if let date = current[task], date > Date() { result.append((task, date)) } }
                  }
                  return result.sorted { $0.1 < $1.1 }
              }
              var body: some View {
                  HFPageBackground {
                      ScrollView(showsIndicators: false) {
                          LazyVStack(spacing: 0) {
                              ForEach(Array(taskReminders.enumerated()), id: \.offset) { _, item in
                                  HStack(spacing: 13) {
                                      Image(systemName: "bell").foregroundStyle(hfGreen)
                                      VStack(alignment: .leading, spacing: 4) {
                                          Text(item.0).font(.system(size: 16)).foregroundStyle(hfText)
                                          Text(item.1, style: .date).font(.system(size: 13)).foregroundStyle(hfMuted)
                                      }
                                      Spacer()
                                      Text(item.1, style: .time).font(.system(size: 13)).foregroundStyle(hfMuted)
                                  }.padding(20).overlay(alignment: .bottom) { Rectangle().fill(hfLine).frame(height: 1).padding(.leading, 54) }
                              }
                              ForEach(manual, id: \.self) { reminder in
                                  Button { editing = reminder } label: {
                                      HStack(spacing: 13) {
                                          Image(systemName: "bell.badge").foregroundStyle(hfGold)
                                          Text(reminder).font(.system(size: 16)).foregroundStyle(hfText)
                                          Spacer()
                                          Image(systemName: "chevron.right").font(.system(size: 13)).foregroundStyle(hfMuted)
                                      }.padding(20).contentShape(Rectangle())
                                  }.buttonStyle(.plain)
                                  .overlay(alignment: .bottom) { Rectangle().fill(hfLine).frame(height: 1).padding(.leading, 54) }
                              }
                          }
                      }
                  }
                  .navigationTitle("Pripomienky").navigationBarTitleDisplayMode(.inline)
                  .toolbarBackground(hfBackground, for: .navigationBar)
                  .toolbar { ToolbarItem(placement: .topBarTrailing) {
                      Button { showAdd = true } label: { Image(systemName: "plus").foregroundStyle(hfText).frame(width: 40, height: 40).background(hfGold.opacity(0.16), in: Circle()) }
                  }}
                  .sheet(isPresented: $showAdd) {
                      HFTextAddView(title: "Nová pripomienka", placeholder: "Na čo si chceš spomenúť?") { value in
                          let v = value.trimmingCharacters(in: .whitespacesAndNewlines)
                          guard !v.isEmpty else { return }
                          manual.append(v); UserDefaults.standard.set(manual, forKey: "manualReminders")
                      }
                  }
                  .sheet(isPresented: Binding(get: { editing != nil }, set: { if !$0 { editing = nil } })) {
                      HFTextEditView(title: "Upraviť pripomienku", placeholder: "Na čo si chceš spomenúť?", value: editing ?? "", onSave: { value in
                          if let i = manual.firstIndex(of: editing ?? "") { manual[i] = value; UserDefaults.standard.set(manual, forKey: "manualReminders") }
                      }, onDelete: {
                          manual.removeAll { $0 == (editing ?? "") }; UserDefaults.standard.set(manual, forKey: "manualReminders")
                      })
                  }
              }
          }

          '''
          s = s[:a] + reminders + s[b:]
          p.write_text(s)
          PYREMAIN

          curl -fsSL "https://raw.githubusercontent.com/terezatakacova/HeadFree/main/HeadFree_AppIcon_FINAL.jpg" -o /tmp/HeadFree_AppIcon_FINAL.jpg
          sips -s format png -z 1024 1024 /tmp/HeadFree_AppIcon_FINAL.jpg --out "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png" >/dev/null
          cp "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png" "$APP_DIR/Assets.xcassets/HeadFreeIntroIcon.imageset/HeadFreeIntroIcon.png"

          grep -q 'Image("HeadFreeIntroIcon")' "$APP_DIR/ContentView.swift"
          grep -q 'Calm your mind.' "$APP_DIR/ContentView.swift"
          grep -q 'com.terezatakacova.HeadFree5' "$PROJECT/project.pbxproj"
          grep -q 'INFOPLIST_KEY_UIRequiresFullScreen = YES;' "$PROJECT/project.pbxproj"
          test -f "$APP_DIR/Assets.xcassets/HeadFreeIntroIcon.imageset/HeadFreeIntroIcon.png"
          test -f "$APP_DIR/Assets.xcassets/AppIcon.appiconset/AppIcon.png"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Export source for inspection
        shell: bash
        run: |
          set -e
          SOURCE=$(find extracted -type f -name "ContentView.swift" -print -quit)
          test -n "$SOURCE"
          cp "$SOURCE" ContentView.swift

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-Source-${{ github.run_number }}
          path: ContentView.swift
          if-no-files-found: error

      - name: Build iOS app
        shell: bash
        run: |
          set -e
          xcodebuild -project "$PROJECT" -scheme HeadFree -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Create IPA
        shell: bash
        run: |
          set -e
          test -d build/Build/Products/Release-iphoneos/HeadFree.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeadFree.app Payload/HeadFree.app
          /usr/bin/zip -qry "HeadFree-${{ github.run_number }}.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HeadFree-IPA-${{ github.run_number }}
          path: HeadFree-${{ github.run_number }}.ipa
          if-no-files-found: error
